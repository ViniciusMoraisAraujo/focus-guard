# GoReleaser v2 — FocusGuard
version: 2

project_name: focusguard

before:
  hooks:
    - go mod tidy
    # Regenera o ícone multi-tamanho (focusguard.ico/.png) consumido pelo
    # go-winres (metadados do .exe) e pelo atalho do Desktop nos installers.
    - go run ./cmd/focusguard-icon
    # go-winres make lê versioninfo.json (--in) e emite rsrc_windows_*.syso
    # na pasta do package, embedados automaticamente pelo go build no Windows.
    # O GoReleaser executa hooks sem shell, então o condicional vai via sh -c.
    - sh -c "if command -v go-winres >/dev/null 2>&1; then cd cmd/focusguard-daemon && go-winres make --in ../../versioninfo.json --arch amd64,arm64 && cd ../../cmd/focusguard && go-winres make --in versioninfo.json --arch amd64,arm64 && cd ../../cmd/focusguard-tray && go-winres make --in versioninfo.json --arch amd64,arm64; fi"
    # Compila a interface web (React) e copia o dist para cmd/focusguard-web/assets
    # (embutido via go:embed). Requer Node.js no runner da release.
    - sh -c "cd focusguard-ui && npm ci && npm run build && find ../cmd/focusguard-web/assets -mindepth 1 -maxdepth 1 ! -name '.gitkeep' -exec rm -rf {} + && cp -r dist/. ../cmd/focusguard-web/assets/"

env:
  - CGO_ENABLED=0

builds:
  - id: cli-linux
    main: ./cmd/focusguard
    binary: focusguard
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

  - id: cli-windows
    main: ./cmd/focusguard
    binary: focusguard
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

  - id: daemon-linux
    main: ./cmd/focusguard-daemon
    binary: focusguard-daemon
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.daemonVersion={{ .Version }}

  - id: daemon-windows
    main: ./cmd/focusguard-daemon
    binary: focusguard-daemon
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.daemonVersion={{ .Version }}

  - id: watchdog-linux
    main: ./cmd/focusguard-watchdog
    binary: focusguard-watchdog
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

  - id: watchdog-windows
    main: ./cmd/focusguard-watchdog
    binary: focusguard-watchdog
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

  - id: tray-linux
    main: ./cmd/focusguard-tray
    binary: focusguard-tray
    goos:
      - linux
    goarch:
      - amd64
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    ldflags:
      - -s -w

  - id: tray-windows
    main: ./cmd/focusguard-tray
    binary: focusguard-tray
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -H windowsgui

  - id: web-linux
    main: ./cmd/focusguard-web
    binary: focusguard-web
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

  - id: web-windows
    main: ./cmd/focusguard-web
    binary: focusguard-web
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - id: windows
    ids:
      - cli-windows
      - daemon-windows
      - watchdog-windows
      - tray-windows
      - web-windows
    formats:
      - zip
    name_template: '{{ .ProjectName }}_{{ .Version }}_windows_{{ .Arch }}'
    files:
      - src: install.txt
        dst: install.txt
      - src: scripts/install-daemon.ps1
        dst: install-daemon.ps1

  - id: linux
    ids:
      - cli-linux
      - daemon-linux
      - watchdog-linux
      - tray-linux
      - web-linux
    formats:
      - tar.gz
    allow_different_binary_count: true
    name_template: '{{ .ProjectName }}_{{ .Version }}_linux_{{ .Arch }}'
    files:
      - src: install.txt
        dst: install.txt
      - src: README.md
      - src: CHANGELOG.md
      - src: focusguard.png
        dst: focusguard.png
      - src: focusguard.ico
        dst: focusguard.ico
      - src: scripts/focusguard.service
        dst: focusguard.service
      - src: scripts/focusguard-tray.desktop
        dst: focusguard-tray.desktop
      - src: scripts/install-linux.sh
        dst: install-linux.sh

checksum:
  name_template: checksums.txt

snapshot:
  version_template: '{{ .Tag }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  draft: false
  prerelease: auto
  header: |
    Veja as novidades desta versão no [CHANGELOG](CHANGELOG.md).

    ---