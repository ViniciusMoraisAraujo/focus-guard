name: android-build

on:
  push:
    branches:
      - '**'
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
    tags:
      - 'android-v*'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure Android SDK Path
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest --stacktrace || {
            echo "::error::Unit tests failed! Displaying test results:"
            for f in $(find app/build/test-results/testDebugUnitTest/ -name "*.xml"); do
              echo "=== TEST RESULT: $f ==="
              cat "$f"
            done
            exit 1
          }

      - name: Build Debug & Release APKs
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease

      - name: Prepare APK outputs
        run: |
          mkdir -p build-apks
          find android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} build-apks/focusguard-debug.apk \;
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} build-apks/focusguard-release.apk \;
          ls -la build-apks/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: focusguard-debug-apk
          path: build-apks/focusguard-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: focusguard-release-apk
          path: build-apks/focusguard-release.apk
          if-no-files-found: error

      - name: Upload APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Anexando APKs à release ${{ github.ref_name }}..."
          gh release upload "${{ github.ref_name }}" \
            build-apks/focusguard-debug.apk \
            build-apks/focusguard-release.apk \
            --clobber || echo "Release ainda não criada ou tag não associada a release."
