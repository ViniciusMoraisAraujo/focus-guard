name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Contrato Go→TS: o types.ts é gerado (make contract); se alguém mudou
      # um struct do IPC e esqueceu de regenerar, a release falha aqui em vez
      # de publicar um espelho desatualizado (Fase 2 do docs/refactor-plan.md).
      - name: Check Go→TS contract is up to date
        run: make contract-check

      - name: Install tray build dependencies (Linux cgo)
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libgtk-3-dev

      - name: Set up Node.js (web UI build)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: focusguard-ui/package-lock.json

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Instalador único do Windows (.msi) via go-msi + WiX Toolset.
  # Roda no windows-latest porque o go-msi invoca o WiX (candle/light) via cmd.exe.
  # Depende do job goreleaser para garantir que a release já exista no upload.
  windows-msi:
    runs-on: windows-latest
    needs: goreleaser
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js (web UI build)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: focusguard-ui/package-lock.json

      - name: Install WiX Toolset (go-msi dependency)
        run: choco install wixtoolset --no-progress -y

      # Pinned: o template customizado (scripts/msi/product.wxs) segue o schema
      # deste commit do go-msi (v0.0.0-20200224144923). Não usar @latest — um
      # schema novo quebraria a geração silenciosamente.
      - name: Install go-msi (pinned)
        run: go install github.com/mat007/go-msi@4783d3eea8eb18a7819d1d1ffac877c3edd50527

      # Compila a interface web (React) e copia o dist para
      # cmd/focusguard-web/assets (embutido via go:embed). Sem isso o
      # focusguard-web.exe gerado pelo build-msi.sh embute uma pasta de
      # assets vazia e a UI não abre após instalar o .msi.
      - name: Build web UI
        shell: bash
        run: |
          cd focusguard-ui
          npm ci
          npm run build
          find ../cmd/focusguard-web/assets -mindepth 1 -maxdepth 1 ! -name '.gitkeep' -exec rm -rf {} +
          cp -r dist/. ../cmd/focusguard-web/assets/

      - name: Build MSI installer
        shell: bash
        env:
          FG_VERSION: ${{ github.ref_name }}
        run: |
          # 'v0.9.0' -> '0.9.0' (o go-msi exige semver sem prefixo 'v')
          VERSION="${FG_VERSION#v}"
          bash scripts/build-msi.sh "$VERSION" amd64

      - name: Upload MSI to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            "focusguard-${VERSION}-amd64.msi" \
            --clobber
          echo "::notice::MSI anexado à release: focusguard-${VERSION}-amd64.msi"

  # ---------------------------------------------------------------- Android APK
  # Compila os APKs do aplicativo nativo Android (Release e Debug) via Gradle Wrapper,
  # valida com a suíte de testes unitários e anexa os arquivos diretamente à release.
  # Depende do job goreleaser para garantir que a release já exista no upload.
  android-release:
    name: Android APKs
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure Android SDK Path
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest --stacktrace

      - name: Configure Signing Keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "==> Configurando Keystore de assinatura Android..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
            echo "ANDROID_KEYSTORE_FILE=release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::notice::ANDROID_KEYSTORE_BASE64 não configurado. Utilizando assinatura de depuração (debug fallback)."
          fi

      - name: Build Android APKs
        env:
          FG_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${FG_VERSION#v}"
          cd android
          ./gradlew assembleRelease assembleDebug -PversionName="$VERSION"

      - name: Prepare APK outputs
        env:
          FG_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${FG_VERSION#v}"
          mkdir -p build-apks
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} "build-apks/focusguard-${VERSION}.apk" \;
          find android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} "build-apks/focusguard-${VERSION}-debug.apk" \;
          ls -la build-apks/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v5
        with:
          name: focusguard-apks
          path: build-apks/*.apk
          if-no-files-found: error

      - name: Upload APKs to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "==> Anexando APKs à release $GITHUB_REF_NAME..."
          gh release upload "$GITHUB_REF_NAME" \
            "build-apks/focusguard-${VERSION}.apk" \
            "build-apks/focusguard-${VERSION}-debug.apk" \
            --clobber
          echo "::notice::APKs anexados à release: focusguard-${VERSION}.apk e focusguard-${VERSION}-debug.apk"

  # ---------------------------------------------------------------- Code Signing
  # Assina todos os binários Windows (.exe) e instaladores (.msi) com
  # Authenticode. Roda DEPOIS do goreleaser (que publica os .exe) e do
  # windows-msi (que publica os .msi), baixa tudo da release, assina e
  # re-uploa — os binários finais são assinados e verificáveis.
  #
  # Requer os seguintes GitHub Secrets:
  #   WINDOWS_SIGN_CERTIFICATE      — conteúdo base64 do arquivo .pfx
  #   WINDOWS_SIGN_CERTIFICATE_PASSWORD — senha do .pfx
  #
  # Se os secrets não estiverem configurados, o job é pulado (signing
  # é opcional nas primeiras releases enquanto o certificado não é obtido).
  check-windows-signing:
    name: Check Windows Signing Certificate
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Verify certificate secret presence
        id: check
        env:
          WIN_CERT: ${{ secrets.WINDOWS_SIGN_CERTIFICATE }}
        run: |
          if [ -n "$WIN_CERT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::WINDOWS_SIGN_CERTIFICATE não configurado. Assinatura Authenticode será pulada."
          fi

  sign-windows:
    runs-on: windows-latest
    needs: [goreleaser, windows-msi, check-windows-signing]
    if: needs.check-windows-signing.outputs.enabled == 'true'
    steps:
      - name: Checkout (scripts)
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/sign-windows.ps1
          sparse-checkout-cone-mode: false

      - name: Download release binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $tag = "${{ github.ref_name }}"
          $dir = "signing-staging"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null

          Write-Host "==> Baixando binários da release $tag..."

          # Baixar o zip da release (contém os .exe)
          $zipName = "focusguard_${version}_windows_amd64.zip"
          gh release download "$tag" --pattern "$zipName" --dir "$dir"
          Expand-Archive -Path "$dir\$zipName" -DestinationPath "$dir\exe" -Force
          Remove-Item "$dir\$zipName" -Force

          # Baixar os .msi
          gh release download "$tag" --pattern "focusguard-*-amd64.msi" --dir "$dir\msi"

          # Listar arquivos para assinatura
          Write-Host "==> Arquivos para assinatura:"
          Get-ChildItem -Path $dir -Recurse -Include *.exe,*.msi | ForEach-Object {
            Write-Host "  - $($_.FullName)"
          }

      - name: Decode certificate
        shell: pwsh
        run: |
          $pfxBase64 = "${{ secrets.WINDOWS_SIGN_CERTIFICATE }}"
          $pfxBytes = [Convert]::FromBase64String($pfxBase64)
          [IO.File]::WriteAllBytes("${{ runner.temp }}\certificate.pfx", $pfxBytes)
          Write-Host "==> Certificado decodificado: ${{ runner.temp }}\certificate.pfx"

      - name: Sign binaries
        shell: pwsh
        run: |
          $staging = Join-Path ${{ github.workspace }} "signing-staging"
          $cert = Join-Path ${{ runner.temp }} "certificate.pfx"
          $password = "${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}"

          & .\scripts\sign-windows.ps1 `
            -CertificatePath $cert `
            -CertificatePassword $password `
            -SearchPath $staging `
            -Description "FocusGuard — bloqueio focado de distrações"

      - name: Re-upload signed binaries to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="signing-staging"

          echo "==> Re-uploanding binários assinados..."

          # Re-upload .exe files from the extracted zip
          for exe in "$DIR"/exe/*.exe; do
            [ -f "$exe" ] && gh release upload "$GITHUB_REF_NAME" "$exe" --clobber
          done

          # Re-upload .msi files
          for msi in "$DIR"/msi/*.msi; do
            [ -f "$msi" ] && gh release upload "$GITHUB_REF_NAME" "$msi" --clobber
          done

          echo "::notice::Binários assinados com Authenticode e re-uploandados à release"

      - name: Cleanup certificate
        if: always()
        shell: pwsh
        run: |
          $cert = Join-Path ${{ runner.temp }} "certificate.pfx"
          if (Test-Path $cert) {
            Remove-Item $cert -Force
            Write-Host "==> Certificado removido do runner."
          }
