name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tray build dependencies (Linux cgo)
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libgtk-3-dev

      - name: Set up Node.js (web UI build)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: focusguard-ui/package-lock.json

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Instalador único do Windows (.msi) via go-msi + WiX Toolset.
  # Roda no windows-latest porque o go-msi invoca o WiX (candle/light) via cmd.exe.
  # Depende do job goreleaser para garantir que a release já exista no upload.
  windows-msi:
    runs-on: windows-latest
    needs: goreleaser
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js (web UI build)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: focusguard-ui/package-lock.json

      - name: Install WiX Toolset (go-msi dependency)
        run: choco install wixtoolset --no-progress -y

      # Pinned: o template customizado (scripts/msi/product.wxs) segue o schema
      # deste commit do go-msi (v0.0.0-20200224144923). Não usar @latest — um
      # schema novo quebraria a geração silenciosamente.
      - name: Install go-msi (pinned)
        run: go install github.com/mat007/go-msi@4783d3eea8eb18a7819d1d1ffac877c3edd50527

      # Compila a interface web (React) e copia o dist para
      # cmd/focusguard-web/assets (embutido via go:embed). Sem isso o
      # focusguard-web.exe gerado pelo build-msi.sh embute uma pasta de
      # assets vazia e a UI não abre após instalar o .msi.
      - name: Build web UI
        shell: bash
        run: |
          cd focusguard-ui
          npm ci
          npm run build
          find ../cmd/focusguard-web/assets -mindepth 1 -maxdepth 1 ! -name '.gitkeep' -exec rm -rf {} +
          cp -r dist/. ../cmd/focusguard-web/assets/

      - name: Build MSI installer
        shell: bash
        env:
          FG_VERSION: ${{ github.ref_name }}
        run: |
          # 'v0.9.0' -> '0.9.0' (o go-msi exige semver sem prefixo 'v')
          VERSION="${FG_VERSION#v}"
          bash scripts/build-msi.sh "$VERSION" amd64

      - name: Upload MSI to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" "focusguard-${VERSION}-amd64.msi" --clobber
          echo "::notice::MSI anexado à release: focusguard-${VERSION}-amd64.msi"
