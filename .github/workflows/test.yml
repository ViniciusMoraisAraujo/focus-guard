name: test

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  # Validação do docs/session-log/ (handoff diário entre sessões de agentes —
  # regra do AGENT.md raiz §4.15): o CI confere a ESTRUTURA de todos os
  # resumos existentes (nome YYYY-MM-DD.md, título e seções do template). Não
  # exige o arquivo de HOJE — o push pode acontecer em dia diferente do
  # trabalho; a checagem do dia é local (make session-check).
  session-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Session-log structure check
        run: bash scripts/check-session-log.sh

  # Etapa 3 do bug-hunt (docs/bug-hunt-plan.md): o -race não roda no Windows
  # local (CGO_ENABLED=0) — a verificação de data races vive aqui, no CI Linux,
  # nos pacotes concorrentes (lifecycle do daemon, event hub, roteador IPC,
  # pomodoro, schedule, scheduler, processguard e store).
  race:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ./... inclui o internal/system/tray, cgo no Linux — sem os headers o
      # go build/vet falham (mesma dependência que o release.yml instala).
      - name: Install tray build dependencies (Linux cgo)
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libgtk-3-dev

      - name: Build + vet
        run: |
          go build ./...
          go vet ./...

      # Plain scalar NÃO: o folding do YAML dobra a \ + newline em "\ " e o
      # shell escapa o espaço, colando um espaço à frente de cada path
      # ("malformed import path"). Usar run: | (literal block) preserva os
      # newlines e a continuação de linha do shell funciona de verdade.
      - name: Race detector — pacotes concorrentes
        run: |
          go test -race -count=1 -timeout=180s \
            ./internal/system/daemon/ \
            ./internal/transport/eventhub/ \
            ./internal/transport/ipc/ \
            ./internal/domain/pomodoro/ \
            ./internal/domain/schedule/ \
            ./internal/domain/scheduler/ \
            ./internal/infrastructure/processguard/ \
            ./internal/infrastructure/store/

      # Etapa 7 do bug-hunt (docs/bug-hunt-plan.md): o teste de chown do
      # socket (root:focusguard 0660, TestListen_ChownsSocketToFocusGuardGroup)
      # faz Skip sem root — o job acima roda como usuário runner, então o
      # chown nunca é verificado no CI. Este step roda o teste via sudo com um
      # GOCACHE separado (root escreve em /root, não no cache do runner). O
      # grep no '--- PASS' evita o falso-verde de um go test -run sem match
      # (teste renomeado/removido sairia com exit 0 silenciosamente).
      - name: Socket group chown test (Linux, root)
        run: |
          out="$(sudo -E env "PATH=$PATH" GOCACHE=/tmp/fg-root-gocache \
            go test -count=1 -timeout=120s -run 'TestListen_ChownsSocketToFocusGuardGroup' -v \
            ./internal/transport/ipc/)"
          echo "$out"
          echo "$out" | grep -q -- '--- PASS: TestListen_ChownsSocketToFocusGuardGroup' \
            || { echo 'chown test não passou (renomeado/skipado?)'; exit 1; }
